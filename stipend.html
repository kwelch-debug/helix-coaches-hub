<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stipend Sheet · Helix Coaches Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--green:#024A3C;--red:#C8102E;--bg:#F3F5F4;--card:#fff;--ink:#16201D;--muted:#5B6662;--line:#DCE3E0;--field:#fff;--okc:#0B6B4F}
@media (prefers-color-scheme: dark){:root{--bg:#0E1513;--card:#17211E;--ink:#E7EEEB;--muted:#9FB0AA;--line:#2A3833;--field:#0F1916;--okc:#7FD3B8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--green);color:#fff;padding:16px}
header div{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{height:40px}
header h1{margin:0;font-size:20px}
header a{color:#fff;font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.note{color:var(--muted);font-size:14px;margin:0 0 12px}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--ink);margin:0;cursor:pointer}
.toggle input{width:22px;height:22px;min-height:0;margin:0}
.lvl-body{margin-top:12px}
.coach{display:grid;grid-template-columns:1fr;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
@media(min-width:560px){.coach{grid-template-columns:1.1fr 1.4fr .7fr auto;align-items:end;border:0;padding:0;margin-bottom:8px}}
.x{background:none;border:0;color:var(--red);font:inherit;font-size:14px;cursor:pointer;padding:10px 6px;min-height:44px}
.total{font-weight:700;margin:6px 0 10px}
.total.ok{color:var(--okc)}
.total.bad{color:var(--red)}
.btn{display:inline-block;border:0;border-radius:10px;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer;min-height:44px}
.add{background:transparent;border:2px dashed var(--line);color:var(--ink);width:100%}
.go{background:var(--red);color:#fff;width:100%;font-size:17px}
.go[disabled]{opacity:.6}
.msg{border-radius:12px;padding:12px 14px;margin-bottom:14px;display:none}
.msg.ok{display:block;background:#E3F4EC;color:#0B3D2E;border:1px solid #A9D8C2}
.msg.err{display:block;background:#FDE8EA;color:#7A0A1A;border:1px solid #F2B3BC}
.hp{position:absolute;left:-9999px}
.test{background:#FFF6DA;color:#5A4500;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:14px}
</style>
</head>
<body>
<header><div><img src="logo-h-white.svg" alt=""><div><h1>Stipend Sheet</h1><a href="./#requirements">← Back to the Coaches Hub</a></div></div></header>
<main>
  <div id="testNote" class="test" hidden>Test mode: this sheet emails only Kathryn and is marked "TEST" on the report.</div>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <form id="f" novalidate>
    <div class="card">
      <h2>Program</h2>
      <p class="note">Head coaches: list <b>every</b> coach in your program and each coach's share of that level's stipend. Each level should add up to 100%. Volunteers can be listed at 0%.</p>
      <div class="grid">
        <div><label for="sport">Sport</label><select id="sport" required></select></div>
        <div><label for="year">School year</label><select id="year"></select></div>
        <div><label for="coach">Your name (head coach)</label><input id="coach" autocomplete="name" required></div>
        <div><label for="email">Your email</label><input id="email" type="email" autocomplete="email" placeholder="you@helixcharter.net"></div>
      </div>
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    </div>

    <div id="levels"></div>

    <div class="card">
      <label for="notes">Notes for the athletic office (optional)</label>
      <textarea id="notes" placeholder="Anything Damon and Kathryn should know, like a mid-season change."></textarea>
    </div>

    <button class="btn go" id="send" type="submit">Send stipend sheet</button>
  </form>
</main>

<datalist id="positions"><option>Head Coach</option><option>Assistant Coach</option><option>Volunteer Coach</option></datalist>

<script>
/* ===== EDIT HERE: sport, school year and level choices ===== */
const SPORTS = ["Baseball", "Boys Basketball", "Girls Basketball", "Girls Beach Volleyball", "Cheer", "Cross Country",
  "Girls Field Hockey", "Girls Flag Football", "Football", "Boys Golf", "Girls Golf", "Boys Lacrosse", "Girls Lacrosse",
  "Boys Soccer", "Girls Soccer", "Softball", "Swim & Dive", "Boys Tennis", "Girls Tennis", "Track & Field",
  "Boys Volleyball", "Girls Volleyball", "Boys Water Polo", "Girls Water Polo", "Boys Wrestling", "Girls Wrestling", "Other"];
const YEARS = ["2026-27", "2027-28"];
const LEVELS = ["Varsity", "JV", "Freshman / Novice"];
/* ===== end of edit area ===== */

const ENDPOINT = "https://script.google.com/macros/s/AKfycbzM56HSLVZDQR00HAvcAymQx3XOOVPG01OGtsDSzpRwOZmfYlURm00aBQXI566wjZI/exec";
const TEST = new URLSearchParams(location.search).get("test") === "1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("#sport").innerHTML = `<option value="">Choose a sport</option>` + SPORTS.map(v => `<option>${esc(v)}</option>`).join("");
$("#year").innerHTML = YEARS.map(v => `<option>${esc(v)}</option>`).join("");
if (TEST) $("#testNote").hidden = false;

const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
["sport", "coach", "email"].forEach(id => { const v = store.get("stipend-" + id); if (v) $("#" + id).value = v; });

function coachRow(first) {
  return `<div class="coach">
    <div><label>Position</label><input name="position" list="positions" placeholder="Head Coach" value="${first ? "Head Coach" : ""}"></div>
    <div><label>Name</label><input name="name" placeholder="First and last name"></div>
    <div><label>% of stipend</label><input name="pct" type="number" min="0" max="100" step="0.5" inputmode="decimal" placeholder="%"></div>
    <button type="button" class="x">Remove</button>
  </div>`;
}
function levelCard(name, i) {
  return `<div class="card level" data-level="${esc(name)}">
    <label class="toggle"><input type="checkbox" class="on" ${i === 0 ? "checked" : ""}> ${esc(name)}</label>
    <div class="lvl-body" ${i === 0 ? "" : "hidden"}>
      <div class="rows"></div>
      <div class="total"></div>
      <button type="button" class="btn add">+ Add another coach</button>
    </div></div>`;
}
$("#levels").innerHTML = LEVELS.map(levelCard).join("");

function update(card) {
  const rows = [...card.querySelectorAll(".coach")];
  rows.forEach(r => r.querySelector(".x").hidden = rows.length === 1);
  const filled = rows.filter(r => r.querySelector("[name=name]").value.trim());
  const sum = Math.round(rows.reduce((n, r) => n + (Number(r.querySelector("[name=pct]").value) || 0), 0) * 100) / 100;
  const t = card.querySelector(".total");
  if (!filled.length) { t.className = "total"; t.textContent = ""; return; }
  t.className = "total " + (sum === 100 ? "ok" : "bad");
  t.textContent = sum === 100 ? "Total: 100% ✓" : `Total: ${sum}% (should be 100%)`;
}
function addCoach(card) {
  const box = card.querySelector(".rows");
  box.insertAdjacentHTML("beforeend", coachRow(!box.children.length));
  const r = box.lastElementChild;
  r.querySelector(".x").onclick = () => { r.remove(); update(card); };
  r.querySelectorAll("input").forEach(inp => inp.oninput = () => update(card));
  update(card);
  return r;
}
document.querySelectorAll(".level").forEach(card => {
  addCoach(card); addCoach(card);
  card.querySelector(".add").onclick = () => addCoach(card).querySelector("[name=position]").focus();
  card.querySelector(".on").onchange = e => card.querySelector(".lvl-body").hidden = !e.target.checked;
});

function show(kind, html) { const m = $("#msg"); m.className = "msg " + kind; m.innerHTML = html; m.scrollIntoView({ behavior: "smooth", block: "center" }); }

$("#f").onsubmit = async e => {
  e.preventDefault();
  const levels = [...document.querySelectorAll(".level")].filter(c => c.querySelector(".on").checked).map(c => ({
    level: c.dataset.level,
    coaches: [...c.querySelectorAll(".coach")].map(r => ({
      position: r.querySelector("[name=position]").value.trim(),
      name: r.querySelector("[name=name]").value.trim(),
      pct: r.querySelector("[name=pct]").value.trim()
    })).filter(x => x.name || x.pct)
  })).filter(l => l.coaches.length);
  const missing = [];
  if (!$("#sport").value) missing.push("your sport");
  if (!$("#coach").value.trim()) missing.push("your name");
  if (!levels.length) missing.push("at least one coach");
  if (levels.some(l => l.coaches.some(x => !x.name))) missing.push("a name for every coach with a percentage");
  if (levels.some(l => l.coaches.some(x => x.pct === "" || +x.pct < 0 || +x.pct > 100))) missing.push("a percentage (0 to 100) for every coach");
  if (missing.length) return show("err", "Please add " + missing.join(", ") + ".");

  const off = levels.filter(l => Math.round(l.coaches.reduce((n, x) => n + Number(x.pct), 0) * 100) / 100 !== 100);
  if (off.length && !confirmOnce(off.map(l => l.level))) return;

  const body = { mode: "stipend-submit", test: TEST, website: $("#website").value, sport: $("#sport").value, year: $("#year").value,
    coach: $("#coach").value.trim(), email: $("#email").value.trim(), notes: $("#notes").value.trim(), levels };
  ["sport", "coach", "email"].forEach(id => store.set("stipend-" + id, $("#" + id).value));
  const btn = $("#send"); btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(r => r.json());
    if (!r.ok) throw new Error(r.error || "Something went wrong.");
    show("ok", `<b>Sent.</b> ${r.coaches} coach${r.coaches === 1 ? "" : "es"} listed (sheet # ${esc(r.sheet)}). Damon and Kathryn got a copy.`);
    $("#notes").value = "";
  } catch (err) {
    show("err", "Your stipend sheet didn't send: " + esc(err.message || err) + " Please try again, or email Kathryn Welch at kwelch@helixcharter.net.");
  } finally { btn.disabled = false; btn.textContent = "Send stipend sheet"; }
};

/* First press with a total that isn't 100%: warn on the page. Pressing Send again sends it anyway (flagged in the email). */
let warned = "";
function confirmOnce(names) {
  const key = names.join("|");
  if (warned === key) return true;
  warned = key;
  show("err", `<b>${esc(names.join(", "))}</b> ${names.length === 1 ? "doesn't" : "don't"} add up to 100%. Fix the percentages, or press <b>Send</b> again to send it as is.`);
  return false;
}
</script>
</body>
</html>
